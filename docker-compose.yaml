version: '3'

services:
  # The Hermes turn daemon, on the Python version the agent requires (3.14).
  # The voice container reaches it by service name; see PIB_HERMES_DAEMON_URL.
  hermes-daemon:
    image: pib-hermes-daemon
    build:
      context: .
      dockerfile: ./public_api_client/Dockerfile
      additional_contexts:
        # The agent checkout supplies pyproject.toml and uv.lock for its own
        # dependency set.
        hermes: /home/pib/.hermes/hermes-agent
    restart: always
    environment:
      HERMES_HOME: /home/pib/.hermes
      PIB_HERMES_PROFILES_DIR: /home/pib/.hermes/profiles
      # Prevent hermes_bootstrap from trying to sync/re-exec into a host-managed
      # store Python; the image carries its own 3.14 venv in /src/.venv.
      HERMES_DISABLE_LAZY_INSTALLS: "1"
      # hermes_home_scope imports hermes_constants before a turn sets its own path,
      # and the agent sources come from the mounted view, so they belong on the path.
      PYTHONPATH: /app:/app/public_api_client:/app/pib_hermes_config:/app/pib_api_client:/app/pib_mcp_server:/home/pib/.hermes/hermes-agent:/src/.venv/lib/python3.14/site-packages
      PIB_HERMES_DAEMON_HOST: 0.0.0.0
      PIB_HERMES_DAEMON_PORT: "8088"
      FLASK_API_BASE_URL: http://flask-app:5000
      PIB_CLOUD_BASE_URL: ${PIB_CLOUD_BASE_URL:-https://api.pib.rocks/v1}
      TRYB_URL_PREFIX: https://platform.tryb.ai
      PIB_MCP_API_BASE_URL: http://flask-app:5000
      PIB_MCP_ROSBRIDGE_URL: ws://rosbridge-ws:9090
      PIB_MCP_ENABLE_ACTUATION: "true"
    volumes:
      # Same filtered view the voice container uses: profiles plus the agent
      # sources, with the .env files covered by prepare-view.
      - type: bind
        source: ${PIB_VOICE_HERMES_VIEW:-/var/lib/pib-voice-egress/view}
        target: /home/pib/.hermes
        bind:
          propagation: rslave
          create_host_path: false
    networks:
      - pib-network
    security_opt:
      - no-new-privileges:true

  pib-blockly-server:
    image: pib-blockly-server
    build:
      context: ./pib_blockly/pib_blockly_server
      dockerfile: ./Dockerfile
    command: "node /app/dist/pib_blockly_server_bundle.js"
    networks:
      - pib-network
    ports:
      - "2442:2442"
    restart: always

  flask-app:
    image: flask_api
    build:
      context: .
      dockerfile: ./pib_api/flask/Dockerfile
      args:
        # Release tag from the git checkout, injected into /etc/pib_version.
        # The update runner passes this explicitly before `up --build`:
        #   docker compose build --build-arg APP_VERSION=<tag> flask-app
        # Develop-channel builds pass the marker "develop" (there is no tag).
        # This default applies only when that argument and the environment are
        # both absent.
        APP_VERSION: ${APP_VERSION:-v0.6.2}
    command: "bash -c 'flask --app run db upgrade && flask --app run seed_db && flask --app run reconcile_system_properties && flask --app run run --host 0.0.0.0'"
    networks:
      - pib-network
    ports:
      - "5000:5000"
    environment:
      - SQLALCHEMY_DATABASE_URI=sqlite:////app/pibdata.db
      - PIB_BLOCKLY_SERVER_URL=http://pib-blockly-server:2442
      - PYTHON_CODE_DIR=/root/cerebra_programs
      - MARIMO_NOTEBOOKS_DIR=/home/pib/programs/notebooks
      - PIB_HERMES_PROFILES_DIR=/home/pib/.hermes/profiles
      - PIB_HERMES_DAEMON_URL=${PIB_HERMES_DAEMON_URL:-http://hermes-daemon:8088}
      - PIB_HARDWARE_VARIANT=${PIB_HARDWARE_VARIANT:-}
      - PIB_UPDATE_DIR=/app/.update
      - PIB_KEY_STORE_PATH=/home/pib/app/secrets/provider_key_store.json
      - PIB_OLLAMA_BASE_URL=http://host.docker.internal:11434
      # Pictures a tool captured are stored here, not in the source bind mount
      # above: a chat message keeps a reference, the bytes live in this volume.
      - PIB_CHAT_IMAGE_DIR=/app/chat_images
      - HOST_IP_FILE=/etc/pib_host_ip
      # Empty means read /etc/pib_smart_chats. 0 disables the Hermes channel.
      - PIB_SMART_CHATS=${PIB_SMART_CHATS:-}
      - HOMEASSISTANT_URL=${HOMEASSISTANT_URL:-http://homeassistant:8123}
      - MATTER_SERVER_URL=${MATTER_SERVER_URL:-ws://host.docker.internal:5580/ws}
    volumes:
      - ./pib_api/flask/:/app
      - /home/pib/app/pib-backend/pib_hermes_config/pib_hermes_config:/app/pib_hermes_config
      # Ciphertext for provider keys. Not the flask source tree, and not the
      # Hermes profiles directory (SOUL.md / MEMORY.md live there).
      - /home/pib/app/secrets:/home/pib/app/secrets
      - /home/pib/app/.update:/app/.update
      # A chat image belongs beside its message, not in the flask source tree,
      # which this file mounts as /app. A named volume survives the recreate of
      # the service and the update of the image.
      - chat_images:/app/chat_images
      # The release pairing helper lives in the repository's setup directory, which the flask bind
      # mount above hides: /app *is* pib_api/flask, so nothing inside the container reaches the
      # repository root. Without this mount GET /system/update/available cannot annotate releases.
      - ./setup:/app/setup:ro
      - /etc/pib_hardware_variant:/etc/pib_hardware_variant:ro
      - /etc/pib_smart_chats:/etc/pib_smart_chats:ro
      - /etc/pib_host_ip:/etc/pib_host_ip:ro
      - programs:/root/cerebra_programs
      - /home/pib/programs/notebooks:/home/pib/programs/notebooks
      # A personality's SOUL.md must land on the host, at the same path the
      # ros-voice-assistant service reads it from. Only profiles/ is shared here;
      # the rest of HERMES_HOME holds the agent's credentials, which this
      # externally reachable API has no reason to see.
      - /home/pib/.hermes/profiles:/home/pib/.hermes/profiles
      - /var/run/docker.sock:/var/run/docker.sock
      - /dev/serial/by-id:/dev/serial/by-id:ro
    restart: always
    depends_on:
      - pib-blockly-server

    extra_hosts:
      - host.docker.internal:host-gateway
  rosbridge-ws:
    build:
      context: ./ros_packages
      dockerfile: ./rosbridge/Dockerfile
    command: ros2 launch rosbridge_server rosbridge_websocket_launch.xml
    networks:
      - pib-network
    restart: always
    ports:
      - "9090:9090"

  ros-camera:
    image: ros-camera
    privileged: true
    build:
      context: ./ros_packages
      dockerfile: ./camera/Dockerfile
    command: ros2 run oak_d_lite stereo
    profiles:
      - all
      - camera
    volumes:
      - /dev/:/dev/
      - ${PIB_MODEL_STORE:-/home/pib/app/pib-models}:/models:ro
    devices:
      - /dev/bus/usb:/dev/bus/usb
    networks:
      - pib-network
    environment:
      - PIB_CAMERA_STEREO=auto
    restart: always
    depends_on:
      - rosbridge-ws

  ros-motors:
    image: ros_motors
    build:
      context: .
      dockerfile: ./ros_packages/motors/Dockerfile
    command: ros2 launch motors launch.py
    profiles:
      - all
      - motors
    volumes:
      - /dev/:/dev/
    device_cgroup_rules:
      - "c 166:* rmw"
      - "c 188:* rmw"
    networks:
      - pib-network
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - FLASK_API_BASE_URL=http://flask-app:5000
      - PIB_BLOCKLY_SERVER_URL=http://pib-blockly-server:2442
      - TINKERFORGE_HOST=host.docker.internal
      - TINKERFORGE_PORT=4223
    restart: always
    depends_on:
      - rosbridge-ws
      - flask-app

  ros-voice-assistant:
    # Stable policy identity: keep identical to setup/voice_egress/allowlist.json.
    mac_address: "02:50:49:42:00:45"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    image: ros_voice_assistant
    build:
      context: .
      dockerfile: ./ros_packages/voice_assistant/Dockerfile
    command: ros2 launch voice_assistant launch.py
    # Host nftables is the enforcement point (setup/voice_egress). A privileged
    # root container can mount the host disk and rewrite that policy.
    privileged: false
    cap_drop:
      - NET_ADMIN
      - NET_RAW
      - SYS_ADMIN
      - SYS_MODULE
      - SYS_RAWIO
      - SYS_PTRACE
    security_opt:
      - no-new-privileges:true
    group_add:
      - "${PIB_AUDIO_GID:-29}"
    device_cgroup_rules:
      - "c 116:* rmw"
      - "c 14:* rmw"
      - "c 189:* rmw"
    profiles:
      - all
      - voice_assistant
    networks:
      - pib-network
    env_file:
      - ros-audio.env
      - password.env
    environment:
      - ALSA_CARD=ArrayUAC10
      - FLASK_API_BASE_URL=http://flask-app:5000
      # Sold cloud API, distinct from the robot-local Flask API above.
      - PIB_CLOUD_BASE_URL=${PIB_CLOUD_BASE_URL:-https://api.pib.rocks/v1}
      - PIB_CLOUD_STT_TIMEOUT_SECONDS=${PIB_CLOUD_STT_TIMEOUT_SECONDS:-3}
      - PIB_CLOUD_MODE=${PIB_CLOUD_MODE:-test}
      # Which live voice path answers: "gemini" (speech-to-speech) or "duplex"
      # (the pib.Cloud relay answers and speaks; transcription stays on the robot).
      # Default keeps the path every robot runs today; a robot opts in per host.
      - PIB_VOICE_BACKEND=${PIB_VOICE_BACKEND:-gemini}
      - PIB_CLOUD_VOICE_URL=${PIB_CLOUD_VOICE_URL:-wss://api.pib.rocks/v1/pib/stream}
      # Channels the array publishes. 1 unless the driver reports its raw channels.
      - PIB_MIC_CHANNELS=${PIB_MIC_CHANNELS:-1}
      - VOICE_ASSISTANT_DIR=/app/ros2_ws/voice_assistant
      - PIB_MCP_ROSBRIDGE_URL=ws://rosbridge-ws:9090
      - PIB_OLLAMA_BASE_URL=http://host.docker.internal:11434
      # Pictures a tool captured are stored here, not in the source bind mount
      # above: a chat message keeps a reference, the bytes live in this volume.
      # Server-side gate for hardware-changing MCP calls. Open by default, so
      # a freshly installed robot is drivable without a further manual step.
      - PIB_MCP_ENABLE_ACTUATION=true
      # Hermes-agent personalities: same profiles dir as flask-app, so the
      # SOUL.md the API writes is the file the agent loads.
      - PIB_HERMES_PROFILES_DIR=/home/pib/.hermes/profiles
      - HERMES_HOME=/home/pib/.hermes
      - PIB_HERMES_BIN=/home/pib/.local/bin/hermes
      - PIB_HERMES_DAEMON_HOST=0.0.0.0
      # Where the turn daemon listens FROM THE NODE'S POINT OF VIEW. Default is the
      # hermes-daemon service: the agent needs Python 3.14, this container has 3.12.
      - PIB_HERMES_DAEMON_URL=${PIB_HERMES_DAEMON_URL:-http://hermes-daemon:8088}
      # Empty means read /etc/pib_smart_chats. 0 disables the Hermes channel.
      - PIB_SMART_CHATS=${PIB_SMART_CHATS:-}
      # GEMINI_API_KEY / GOOGLE_API_KEY are deliberately NOT listed here: they
      # come from the gitignored ./password.env (env_file above). Compose
      # interpolates ${VAR} from the shell or the tracked project-root .env, not
      # from env_file, so an `- GEMINI_API_KEY=${GEMINI_API_KEY}` entry resolves
      # to an empty string when the variable is unset and then overrides the
      # real value from password.env. No hardcoded key / fallback default here.
      # An unlocked key store wins over those variables. The Direct tool loop
      # and the Hermes turn both read that provider's secret from flask at
      # runtime. Hermes does not copy it into the profile. The Hermes tree
      # itself is not mounted raw: profiles/*/.env and ~/.hermes/.env would
      # come with it. prepare-view publishes a filtered view and covers those
      # files. The cloud-operator key is not on this robot.
    volumes:
      - ${PIB_VOICE_DATA_DIR:-/data/voice}:/data/voice
      - /dev/snd:/dev/snd
      - /dev/dsp:/dev/dsp
      - /etc/machine-id:/etc/machine-id
      - /etc/pib_smart_chats:/etc/pib_smart_chats:ro
      - type: bind
        source: ${PIB_VOICE_HERMES_VIEW:-/var/lib/pib-voice-egress/view}
        target: /home/pib/.hermes
        bind:
          propagation: rslave
          create_host_path: false
      - /home/pib/.local/bin/hermes:/home/pib/.local/bin/hermes:ro
      # REQUIRED, do not remove: the hermes wrapper execs the venv interpreter
      # under /home/pib/.hermes/hermes-agent/venv/bin, and that interpreter is a
      # symlink into uv-managed Python here, outside both mounts above. Without
      # this directory the symlink dangles inside the container and every hermes
      # call dies with exit 127 ("No such file or directory"), which surfaces
      # only as the fallback reply. The container's own python3.12 cannot stand
      # in, since the venv is built against 3.11. Mounted whole rather than as a
      # pinned cpython-3.11.x path, because `hermes update` may change the patch
      # version and would silently break a pinned mount.
      - /home/pib/.local/share/uv:/home/pib/.local/share/uv:ro
    devices:
      - /dev/snd:/dev/snd
      - /dev/bus/usb:/dev/bus/usb1
    restart: always
    depends_on:
      - rosbridge-ws
      - flask-app
      - pib-blockly-server
      - ros-audio-io

  ros-programs:
    image: ros_programs
    build:
      context: .
      dockerfile: ./ros_packages/programs/Dockerfile
    command: >
      bash -lc "
        source /opt/ros/jazzy/setup.bash &&
        source /app/ros2_ws/install/setup.bash &&
        ros2 run button_service button_service_node &
        ros2 run smart_home smart_home_node &
        ros2 launch programs launch.py
      "
    profiles:
      - all
      - programs
    environment:
      - FLASK_API_BASE_URL=http://flask-app:5000
      - PIB_BLOCKLY_SERVER_URL=http://pib-blockly-server:2442
      - TINKERFORGE_HOST=host.docker.internal
      - TINKERFORGE_PORT=4223
      - SSH_HOST=host.docker.internal
      - PYTHON_BINARY=/usr/bin/python3
      - PROGRAM_DIR=/ros2_ws/cerebra_programs
      - VOICE_ASSISTANT_DIR=/app/ros2_ws/voice_assistant
      - TF_HOST=host.docker.internal
      - TF_PORT=4223
    volumes:
      - programs:/ros2_ws/cerebra_programs
      - /dev/bus/usb:/dev/bus/usb
    device_cgroup_rules:
      - 'c 189:* rmw'
    restart: always
    networks:
      - pib-network
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - rosbridge-ws
      - pib-blockly-server
      - flask-app

  ros-display:
    image: ros-display
    privileged: true
    build:
      context: .
      dockerfile: ./ros_packages/display/Dockerfile
    profiles:
      - all
      - display
    volumes:
      - ./ros_packages/display/expression_faces:/app/pib-expression-faces:ro
      - ${XDG_RUNTIME_DIR:-/run/user/1000}:/run/user/1000
      - /dev/dri:/dev/dri
      - /home/pib/app/.update:/app/.update
      # A chat image belongs beside its message, not in the flask source tree,
      # which this file mounts as /app. A named volume survives the recreate of
      # the service and the update of the image.
    environment:
      - STATIC_IMAGE_DIR=/app/ros2_ws/display/static_images
      - PIB_EXPRESSION_DIR=/app/pib-expression-faces
      - PIB_DISPLAY_WIDTH=1024
      - PIB_DISPLAY_HEIGHT=600
      - PIB_DISPLAY_ON_DEMAND=1
      - PIB_DISPLAY_TEXT_MAX_CHARS=40
      - PIB_DISPLAY_TEXT_CACHE_MAX=50
      - PIB_DISPLAY_POLL_MS=5
      - PIB_UPDATE_DIR=/app/.update
      - FLASK_API_BASE_URL=http://flask-app:5000
      - PIB_KEY_STORE_PROMPT_URL=http://127.0.0.1:5000/system/key-store/display
      - XDG_RUNTIME_DIR=/run/user/1000
      - WAYLAND_DISPLAY=${WAYLAND_DISPLAY:-wayland-0}
      - GDK_BACKEND=wayland
      - HOME=/tmp
      - ROS_HOME=/tmp/.ros
    user: "1000:1000"
    command: ros2 launch display launch.py
    restart: always
    networks:
      - pib-network

  ros-audio-io:
    image: ros-audio-io
    build:
      context: .
      dockerfile: ./ros_packages/ros_audio_io/Dockerfile
    command: ros2 launch ros_audio_io launch.py
    profiles:
      - all
      - ros_audio_io
      - voice_assistant
    networks:
      - pib-network
    env_file:
      - ros-audio.env
    environment:
      - PULSE_SERVER=unix:${XDG_RUNTIME_DIR:-/run/user/1000}/pulse/native
    devices:
      - /dev/snd:/dev/snd
      - /dev/bus/usb:/dev/bus/usb1
    privileged: true
    volumes:
      - ${PIB_VOICE_DATA_DIR:-/data/voice}:/data/voice
      - /dev/snd:/dev/snd
      - /dev/dsp:/dev/dsp
      - /etc/machine-id:/etc/machine-id
      - ${XDG_RUNTIME_DIR:-/run/user/1000}/pulse/native:${XDG_RUNTIME_DIR:-/run/user/1000}/pulse/native
      - /home/pib/.config/pulse/cookie:/root/.config/pulse/cookie
      - /home/pib/wav-files:/home/pib/wav-files:ro
    restart: always
    depends_on:
      - rosbridge-ws

  matter-server:
    image: ghcr.io/home-assistant-libs/python-matter-server:stable
    profiles:
      - all
      - smarthome
    network_mode: host
    mem_limit: 192m
    security_opt:
      - apparmor=unconfined
    volumes:
      - /home/pib/app/matter-server:/data
      - /run/dbus:/run/dbus:ro
    restart: always

  homeassistant:
    image: ghcr.io/home-assistant/home-assistant:stable
    profiles:
      - all
      - smarthome
    mem_limit: 384m
    ports:
      - "8123:8123"
    environment:
      - TZ=Europe/Berlin
    volumes:
      - /home/pib/app/homeassistant:/config
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - pib-network
    depends_on:
      - matter-server
    restart: always

volumes:
  programs:
  chat_images:

networks:
  pib-network:
      name: pib-network
      driver: bridge