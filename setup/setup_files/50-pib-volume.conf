# Wireplumber restores the volume per route and falls back to its own default for a route it
# has never seen. The stock default is device.routes.default-sink-volume = 0.064, which the
# cubic volume convention displays as 40 %, so a sink that appears on a different USB port
# comes up quiet. Pin both fallbacks to full volume.
wireplumber.settings = {
  device.routes.default-sink-volume = 1.0
  node.stream.default-playback-volume = 1.0
}
