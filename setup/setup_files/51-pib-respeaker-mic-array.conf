# Seeed ReSpeaker Mic Array v2.0 (UAC 1.0): six channels at 16 kHz, S16_LE.
# Channel 0 is the XVF-3000 beamformed, echo-cancelled stream; channels 1–5 are
# raw microphones. ros_audio_io/audio_streamer.py publishes only channel 0 on
# the audio_stream topic; downmixing here would blend raw mics into that stream.
#
# Device match follows voice_assistant/audio_devices.py RESPEAKER_HINTS:
# respeaker, seeed, uac1.0 (case-insensitive substring on node.description).
monitor.alsa.rules = [
  {
    matches = [
      {
        node.name = "~alsa_input.*"
        node.description = "~(?i).*(respeaker|seeed|uac1\\.0).*"
      }
    ]
    actions = {
      update-props = {
        audio.channels = 6
        audio.rate = 16000
        audio.format = "S16LE"
        channelmix.disable = true
        channelmix.upmix = false
        priority.session = 2500
      }
    }
  }
  {
    matches = [
      {
        node.name = "~alsa_input.*"
        node.description = "~(?i).*hdmi.*"
      }
    ]
    actions = {
      update-props = {
        priority.session = 400
      }
    }
  }
]
