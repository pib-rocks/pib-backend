name: Release Drafter

on:
  push:
    branches:
      - develop
  pull_request_target:
    types: [opened, reopened, labeled, unlabeled]

permissions:
  contents: read
  pull-requests: write

jobs:
  update_release_draft:
    permissions:
      contents: write
      pull-requests: write
    runs-on: ubuntu-latest
    steps:
      - uses: release-drafter/release-drafter@v6
        with:
          # Build the draft from develop's history, not the default branch (main).
          # PRs are merged to develop continuously; main only receives them on the
          # rare develop->main sync. Without this, PRs merged to develop after the
          # last main-merge are missing from the notes.
          #
          # A plain branch name, not `refs/heads/develop`: the full ref makes GitHub
          # publish the release with a generated `untagged-<hash>` tag instead of
          # the version tag (measured on the v0.6.5 release, Jira PR-1946). Cerebra
          # has always used the branch name and published correctly.
          commitish: develop
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
