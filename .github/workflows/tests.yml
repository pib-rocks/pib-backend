name: Tests

on:
  pull_request:
  push:
    branches:
      - develop
      - main

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            pib_api/flask/requirements.txt
            tests/requirements-unit.txt
            tests/requirements-camera.txt
      - name: Install unit test dependencies
        # tests/unit/conftest.py imports the Flask app at collection, so the app
        # requirements are installed as well as tests/requirements-unit.txt.
        # The unit file is second: it pins tinkerforge==2.1.32, the Flask file
        # still pins 2.1.31. pytest matches tests/integration/requirements.txt.
        # numpy is imported by the device-free camera tests. mcp and
        # websocket-client are the dependencies declared by pib_mcp_server.
        # tests/requirements-camera.txt supplies depthai, depthai-nodes and
        # opencv. The camera unit tests import those wheels at module level, so
        # a missing wheel has to fail collection. pyyaml is imported by the
        # camera modules (ros_packages/camera/oak_d_lite/model_registry.py).
        run: |
          python -m pip install -r pib_api/flask/requirements.txt
          python -m pip install -r tests/requirements-unit.txt
          python -m pip install pytest==8.3.4 "numpy>=1.26,<3" mcp==2.3.0 websocket-client==1.9.2 pyyaml
          python -m pip install -r tests/requirements-camera.txt
      - name: Install model release asset
        # Blobs are not in git. Tests read models/<model_id>/<model_id>.blob.
        # Tag, name and sha256 are the defaults in setup/setup-pib.sh
        # (PIB_MODEL_ASSET_TAG_DEFAULT, PIB_MODEL_ASSET_NAME_DEFAULT,
        # PIB_MODEL_ASSET_SHA256_DEFAULT). The archive root is the models/ layout.
        run: |
          set -euo pipefail
          tag="model-registry-2026-09-15"
          name="models-2026-09-15.tar.gz"
          sha="07357ec99e0b91014285aad2e6a03fcd1e6ca95fd7ed686670f7ab73c1f3ff02"
          url="https://github.com/pib-rocks/pib-backend/releases/download/${tag}/${name}"
          archive="$(mktemp)"
          curl -fsSL -o "${archive}" "${url}"
          echo "${sha}  ${archive}" | sha256sum -c -
          # --exclude=manifest.yaml: the archive is a snapshot of the store and carries its own,
          # older manifest.yaml. Extracting it would replace the checked-out one, so every test that
          # reads models/manifest.yaml from disk would then assert against the release's copy
          # instead of the branch's. The blobs are the only thing this step is for.
          tar -xzf "${archive}" -C models --exclude=manifest.yaml
          rm -f "${archive}"
      - name: Run unit tests
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: bash tests/run_unit_suite.sh

  jest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: tests/blockly_generator/package-lock.json
      - name: Install generator test dependencies
        working-directory: tests/blockly_generator
        run: npm ci
      - name: Run generator tests
        working-directory: tests/blockly_generator
        run: node node_modules/jest/bin/jest.js --config jest.config.js
